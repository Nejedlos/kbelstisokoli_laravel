name: Validate and deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,testing,views}
          chmod -R 775 bootstrap/cache storage/framework

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, zlib
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate code
        run: |
          vendor/bin/pint --test
          php artisan config:clear --ansi
          php artisan test --parallel --processes=4 --compact

  validate-build-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify production configuration
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_PUBLIC_PATH: ${{ secrets.PRODUCTION_PUBLIC_PATH }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          for required in \
            PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER \
            PRODUCTION_PATH PRODUCTION_PUBLIC_PATH PRODUCTION_SSH_PRIVATE_KEY \
            PRODUCTION_SSH_KNOWN_HOSTS FONTAWESOME_TOKEN
          do
            if [ -z "${!required}" ]; then
              echo "Missing production secret: $required" >&2
              exit 1
            fi
          done

      - name: Create runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,testing,views}
          chmod -R 775 bootstrap/cache storage/framework

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, zlib
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate code
        run: |
          vendor/bin/pint --test
          php artisan config:clear --ansi
          php artisan test --parallel --processes=4 --compact

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build production assets once
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare production dependencies and release archive
        run: |
          composer install --no-dev --no-progress --prefer-dist --optimize-autoloader --no-scripts
          php artisan package:discover --ansi
          php artisan filament:upgrade
          scripts/package-production-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/release-$GITHUB_SHA.tgz"
          sha256sum "$RUNNER_TEMP/release-$GITHUB_SHA.tgz" > "$RUNNER_TEMP/release-$GITHUB_SHA.sha256"
          assets_sha=$(git rev-parse HEAD:public/assets)
          scripts/package-production-assets.sh "$assets_sha" "$RUNNER_TEMP/assets-$assets_sha.tar"
          sha256sum "$RUNNER_TEMP/assets-$assets_sha.tar" > "$RUNNER_TEMP/assets-$assets_sha.sha256"
          echo "ASSETS_SHA=$assets_sha" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload immutable release inputs
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
          incoming="$PRODUCTION_PATH/deploy/incoming"
          ssh -4 -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "mkdir -p $(printf '%q' "$incoming")"
          scp -P "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/release-$GITHUB_SHA.tgz" scripts/deploy-production-release.sh \
            "$remote:$incoming/"
          managed_assets="$PRODUCTION_PATH/deploy/managed-assets/$ASSETS_SHA"
          if ssh -4 -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "test -d $(printf '%q' "$managed_assets")"
          then
            echo "Public assets $ASSETS_SHA are already present on production."
          else
            scp -P "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$RUNNER_TEMP/assets-$ASSETS_SHA.tar" "$remote:$incoming/"
          fi

      - name: Promote release atomically
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_PUBLIC_PATH: ${{ secrets.PRODUCTION_PUBLIC_PATH }}
        run: |
          remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
          incoming="$PRODUCTION_PATH/deploy/incoming"
          archive="$incoming/release-$GITHUB_SHA.tgz"
          assets_archive="$incoming/assets-$ASSETS_SHA.tar"
          script="$incoming/deploy-production-release.sh"
          checksum=$(cut -d ' ' -f 1 "$RUNNER_TEMP/release-$GITHUB_SHA.sha256")
          assets_checksum=$(cut -d ' ' -f 1 "$RUNNER_TEMP/assets-$ASSETS_SHA.sha256")
          ssh -4 -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" \
            "PRODUCTION_PATH=$(printf '%q' "$PRODUCTION_PATH") PRODUCTION_PUBLIC_PATH=$(printf '%q' "$PRODUCTION_PUBLIC_PATH") RELEASE_SHA=$(printf '%q' "$GITHUB_SHA") RELEASE_ARCHIVE=$(printf '%q' "$archive") RELEASE_CHECKSUM=$(printf '%q' "$checksum") ASSETS_SHA=$(printf '%q' "$ASSETS_SHA") ASSETS_ARCHIVE=$(printf '%q' "$assets_archive") ASSETS_CHECKSUM=$(printf '%q' "$assets_checksum") HEALTH_URL=https://kbelstisokoli.cz PHP_BINARY=php8.4 bash $(printf '%q' "$script")"
