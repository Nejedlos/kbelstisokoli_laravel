name: Validate and deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,testing,views}
          chmod -R 775 bootstrap/cache storage/framework

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, zlib
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate code
        run: |
          vendor/bin/pint --test
          php artisan config:clear --ansi
          php artisan test --parallel --processes=4 --compact

  validate-build-deploy:
    if: github.event_name == 'push'
    runs-on: [self-hosted, macOS, ARM64, kbelstisokoli-deploy]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify production configuration
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_PUBLIC_PATH: ${{ secrets.PRODUCTION_PUBLIC_PATH }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          for required in \
            PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER \
            PRODUCTION_PATH PRODUCTION_PUBLIC_PATH PRODUCTION_SSH_PRIVATE_KEY \
            PRODUCTION_SSH_KNOWN_HOSTS FONTAWESOME_TOKEN
          do
            if [ -z "${!required}" ]; then
              echo "Missing production secret: $required" >&2
              exit 1
            fi
          done

      - name: Create runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,testing,views}
          chmod -R 775 bootstrap/cache storage/framework

      - name: Verify self-hosted toolchain
        run: |
          php -r '
            if (version_compare(PHP_VERSION, "8.4.0", "<")) {
                fwrite(STDERR, "PHP 8.4 or newer is required.\n");
                exit(1);
            }
            $missing = array_diff(["mbstring", "dom", "curl", "libxml", "zlib"], get_loaded_extensions());
            if ($missing !== []) {
                fwrite(STDERR, "Missing PHP extensions: ".implode(", ", $missing)."\n");
                exit(1);
            }
          '
          composer --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          node --version
          npm --version

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate code
        run: |
          vendor/bin/pint --test
          php artisan config:clear --ansi
          php artisan test --parallel --processes=4 --compact

      - name: Build production assets once
        env:
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare production dependencies and release archive
        run: |
          rm -f bootstrap/cache/*.php
          composer install --no-dev --no-progress --prefer-dist --optimize-autoloader --no-scripts
          php artisan package:discover --ansi
          php artisan filament:upgrade
          scripts/package-production-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/release-$GITHUB_SHA.tgz"
          assets_sha=$(git rev-parse HEAD:public/assets)
          scripts/package-production-assets.sh "$assets_sha" "$RUNNER_TEMP/assets-$assets_sha.tar"
          echo "ASSETS_SHA=$assets_sha" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          ssh_directory="$RUNNER_TEMP/deploy-ssh"
          install -m 700 -d "$ssh_directory"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$ssh_directory/id_ed25519"
          chmod 600 "$ssh_directory/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 600 "$ssh_directory/known_hosts"
          echo "PRODUCTION_SSH_KEY=$ssh_directory/id_ed25519" >> "$GITHUB_ENV"
          echo "PRODUCTION_SSH_KNOWN_HOSTS_FILE=$ssh_directory/known_hosts" >> "$GITHUB_ENV"

      - name: Upload and promote release atomically
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_PUBLIC_PATH: ${{ secrets.PRODUCTION_PUBLIC_PATH }}
        run: |
          scripts/upload-production-release.sh \
            "$GITHUB_SHA" "$RUNNER_TEMP/release-$GITHUB_SHA.tgz" \
            "$ASSETS_SHA" "$RUNNER_TEMP/assets-$ASSETS_SHA.tar"
